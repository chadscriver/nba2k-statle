name: Daily 2K ratings scrape

on:
  schedule:
    - cron: "0 9 * * *"   # every day at 09:00 UTC (~4-5am ET)
  workflow_dispatch: {}   # adds a "Run workflow" button for manual runs

permissions:
  contents: write          # lets the job commit refreshed data back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scraper.py
      - name: Commit data only if ratings changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No rating changes today — nothing to commit."
          else
            git commit -m "Update 2K ratings $(date -u +%F)"
            git push
          fi
